name: Build BYD ThaiVoice Alpha

on:
  push:
    branches: [alpha1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BT_VER: "36.0.0"
      PLATFORM: android-36
      VOSK_VERSION: "0.3.75"
      JNA_VERSION: "5.18.1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/$PLATFORM/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/$BT_VER/aapt2" ]; then
            sdkmanager "platforms;$PLATFORM" "build-tools;$BT_VER"
          fi
      - name: Fetch pinned Vosk and JNA AAR libraries
        run: |
          set -euo pipefail
          mkdir -p libs
          base=https://repo.maven.apache.org/maven2
          curl --fail --location --retry 3 "$base/com/alphacephei/vosk-android/$VOSK_VERSION/vosk-android-$VOSK_VERSION.aar" -o libs/vosk-android.aar
          curl --fail --location --retry 3 "$base/net/java/dev/jna/jna/$JNA_VERSION/jna-$JNA_VERSION.aar" -o libs/jna.aar
          unzip -tq libs/vosk-android.aar
          unzip -tq libs/jna.aar
      - name: Build and sign test APK
        run: SDK="$ANDROID_HOME" bash build.sh
      - name: Verify APK signature and package
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$BT_VER"
          "$tools/apksigner" verify --verbose build/thaivoice.apk
          "$tools/aapt" dump badging build/thaivoice.apk
          "$tools/aapt" dump badging build/thaivoice.apk | grep -F "name='com.oxsacool.thaivoice'"
          unzip -l build/thaivoice.apk | grep 'lib/arm64-v8a/libvosk.so'
          unzip -l build/thaivoice.apk | grep 'lib/arm64-v8a/libjnidispatch.so'
          (cd build && sha256sum thaivoice.apk > thaivoice.apk.sha256)
      - name: Upload Alpha test APK
        uses: actions/upload-artifact@v4
        with:
          name: BYD-ThaiVoice-Alpha1
          path: |
            build/thaivoice.apk
            build/thaivoice.apk.sha256
          if-no-files-found: error
          retention-days: 14
